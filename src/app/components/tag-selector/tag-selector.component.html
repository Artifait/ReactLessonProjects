<div class="tag-selector">
  <button class="toggle-btn" (click)="toggleMenu()">Select Tags ⋁</button>
  <div class="menu" *ngIf="showMenu">
    <div class="existing">
      <label *ngFor="let tag of allTags">
        <input
          type="checkbox"
          [value]="tag.id"
          [checked]="isSelected(tag)"
          (change)="onCheckboxChange($event, tag)"
        />
        {{ tag.name }}
      </label>
    </div>
    <div class="new-tag">
      <input formControlName="newTag" placeholder="New tag name" />
      <button (click)="onAddNew()">Add</button>
    </div>
    <button class="apply-btn" (click)="onApply()">Apply</button>
  </div>
</div>
