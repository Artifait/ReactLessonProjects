<div class="container">
  <h1>Task Manager</h1>

  <app-task-create (submit)="onCreateTask($event)"></app-task-create>

  <div class="cards">
    <ng-container *ngIf="tasks$ | async as tasks">
      <app-task-card
        *ngFor="let task of tasks"
        [task]="task"
        [availableTags]="(tags$ | async) ?? []"
        (editTask)="onEditTask($event)"
      ></app-task-card>
    </ng-container>
  </div>
</div>
