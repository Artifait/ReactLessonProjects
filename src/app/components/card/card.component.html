@if(props) {
<div class="card">
  <img class="card__img" src="{{ props.image }}" alt="{{ props.title }}" />
  <h2 class="card__title">{{ props.title }}</h2>
  <p class="card__text">{{ props.des }}</p>
  <p class="card__price">{{ props.price }}</p>
  <h3 class="card__categ">{{ props.category }}</h3>
  <button class="card_btn">КУПИТЬ</button>
</div>
}
