<form [formGroup]="form" (ngSubmit)="onSubmit()" class="create-form">
  <label>
    Заголовок
    <input formControlName="title" placeholder="Введите заголовок" />
  </label>
  <label>
    Описание
    <textarea
      formControlName="description"
      placeholder="Описание задачи"
    ></textarea>
  </label>
  <label>
    Тэги
    <app-tag-selector
      [selectedTags]="form.value.tags"
      (selectedChange)="form.patchValue({ tags: $event })"
    ></app-tag-selector>
  </label>
</form>
