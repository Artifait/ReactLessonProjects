<div class="result-container" *ngIf="playerChoice && compChoice && outcome">
  <div class="choice-block">
    <div
      class="icon-wrapper"
      [ngClass]="{ winner: outcome === 'win', loser: outcome === 'lose' }"
    >
      <span class="icon">{{ getIcon(playerChoice) }}</span>
      <span class="label">Вы</span>
    </div>
    <div class="vs-label">VS</div>
    <div
      class="icon-wrapper"
      [ngClass]="{ winner: outcome === 'lose', loser: outcome === 'win' }"
    >
      <span class="icon">{{ getIcon(compChoice) }}</span>
      <span class="label">ПК</span>
    </div>
  </div>

  <div class="outcome-text" [ngClass]="outcome">
    {{
      outcome === "win"
        ? "Вы выиграли! 🎉"
        : outcome === "lose"
        ? "Вы проиграли… 😢"
        : "Ничья 🤝"
    }}
  </div>
</div>
