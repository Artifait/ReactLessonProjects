<div class="game-container">
  <h2>Камень, ножницы, бумага</h2>

  <div class="input-block">
    <label>Имя игрока:</label>
    <input
      [(ngModel)]="playerName"
      placeholder="Введите ваше имя"
      class="name-input"
    />
  </div>

  <!-- Кнопки выбора -->
  <app-choice-buttons (choice)="onPlayerChoose($event)"></app-choice-buttons>

  <!-- Отображение результата (win/lose/draw) -->
  <app-result-display
    [playerChoice]="playerChoice"
    [compChoice]="compChoice"
    [outcome]="outcome"
  ></app-result-display>

  <!-- Статистика игрока -->
  <div class="player-stats" *ngIf="playerStats">
    <h3>Статистика для {{ playerStats.playerName }}</h3>
    <div class="stats-grid">
      <div>Победы: {{ playerStats.wins }}</div>
      <div>Поражения: {{ playerStats.losses }}</div>
      <div>Ничьи: {{ playerStats.draws }}</div>
      <div>Всего игр: {{ playerStats.totalGames }}</div>
    </div>
  </div>

  <!-- Лидерборд -->
  <app-leaderboard [leaderboard]="leaderboard"></app-leaderboard>
</div>
