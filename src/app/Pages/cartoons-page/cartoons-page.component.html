<div class="page-container">
  <h2>Смотреть мультфильмы</h2>

  <div class="status-block">
    <div *ngIf="loading" class="loading">Загрузка мультфильмов…</div>
    <div *ngIf="error" class="error">{{ error }}</div>
  </div>

  <app-cartoons-list
    *ngIf="!loading && !error"
    [cartoons]="cartoons"
  ></app-cartoons-list>
</div>
